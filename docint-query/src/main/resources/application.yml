server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: docmind-query

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:docint}
    username: ${POSTGRES_USER:docint}
    password: ${POSTGRES_PASSWORD:docint_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: docint-query-cache-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.docint.*
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.docint.common.event.DocumentEvent

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  kafka:
    topics:
      document-indexed: document.indexed
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://localhost:5173}
  llm:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      chat-model: ${GEMINI_CHAT_MODEL:gemini-1.5-flash}
      embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-2-preview}
      fallback-embedding-model: ${GEMINI_FALLBACK_EMBEDDING_MODEL:gemini-embedding-001}
      embedding-dimensions: 768
      timeout-seconds: 15
    groq:
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai/v1
      model: ${GROQ_CHAT_MODEL:llama-3.3-70b-versatile}
      timeout-seconds: 10
  cache:
    rag-answer-ttl-minutes: 30
    rag-cross-doc-ttl-minutes: 15
    rate-limit-window-seconds: 60
    rate-limit-max-requests: 60
  search:
    elasticsearch-host: ${ELASTICSEARCH_HOST:localhost}
    elasticsearch-port: ${ELASTICSEARCH_PORT:9200}
    index-name: document_chunks
    top-k: 5
    knn-weight: 0.7

resilience4j:
  circuitbreaker:
    instances:
      geminiLlm:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
      groqLlm:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      geminiLlm:
        maxAttempts: 1          # no retries — timeout fires fast, go straight to Groq
        waitDuration: 500ms
      groqLlm:
        maxAttempts: 2          # one retry on Groq before giving up
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
      elasticsearch:
        maxAttempts: 3
        waitDuration: 1s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    com.docint: DEBUG
    org.springframework.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n"
