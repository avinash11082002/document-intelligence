server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: -1

spring:
  application:
    name: docmind-api

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:docint}
    username: ${POSTGRES_USER:docint}
    password: ${POSTGRES_PASSWORD:docint_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 105MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  upload-dir: ${UPLOAD_DIR:/data/uploads}
  upload:
    max-file-size-bytes: 104857600  # 100MB
  kafka:
    topics:
      document-uploaded: document.uploaded
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://localhost:5173}

docint:
  security:
    jwt:
      secret: ${JWT_SECRET:docint-super-secret-key-that-must-be-at-least-256-bits-long-for-hmac-sha-256}
      expiration-hours: ${JWT_EXPIRATION_HOURS:1}
    refresh-token:
      expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      service: docmind-api

logging:
  level:
    com.docint: INFO
    org.springframework.kafka: WARN
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n"
